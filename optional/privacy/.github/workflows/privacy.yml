name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Sensitive-field logging rules
        run: semgrep scan --error --metrics=off --config .semgrep/privacy.yml backend app
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy with logging macros disallowed
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
