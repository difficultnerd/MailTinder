# cargo-deny policy: advisories, licences, banned crates, allowed sources.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # mailparse/quoted_printable (RFC 2047 / MIME parsing) ship under 0BSD, a
    # permissive OSI-approved licence equivalent to MIT for our purposes.
    "0BSD",
    # Mozilla CA root bundle (webpki-roots) ships under CDLA-Permissive-2.0;
    # it is a permissive data license for certificate roots.
    "CDLA-Permissive-2.0",
    # The WebDriver client used only by the dev-only `e2e` harness crate
    # (fantoccini) depends on the `webdriver` crate, which is MPL-2.0 (a
    # file-level copyleft: no obligation reaches our binaries, and the crate is
    # never a dependency of a shipped service).
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# The workspace's own crates are UNLICENSED; skip them.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
