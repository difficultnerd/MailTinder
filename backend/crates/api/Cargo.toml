[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testkit = ["dep:testkit", "dep:adapters-gcp", "dep:reqwest", "dep:tokio"]

[dependencies]
testkit = { workspace = true, optional = true }
adapters-gcp = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
domain.workspace = true
ports.workspace = true
obs.workspace = true
svc-common.workspace = true
adapters-gmail.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
time.workspace = true
thiserror.workspace = true
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit", "catch-panic"] }
serde_path_to_error = "0.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
testkit.workspace = true
adapters-gcp.workspace = true
proptest.workspace = true
tokio.workspace = true
aes-gcm = { workspace = true, features = ["aes", "zeroize"] }
zeroize.workspace = true
async-trait.workspace = true

[lints]
workspace = true
