[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# e2e configuration (S10 3.3). Never enabled in a release build.
testkit = ["dep:testkit", "dep:reqwest"]

[dependencies]
domain.workspace = true
ports.workspace = true
obs.workspace = true
svc-common.workspace = true
adapters-gcp.workspace = true
adapters-gmail.workspace = true
egress.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
time.workspace = true
thiserror.workspace = true
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit", "catch-panic"] }
serde_path_to_error = "0.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tokio = { workspace = true, features = ["signal"] }
# e2e only (feature `testkit`).
testkit = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
testkit.workspace = true
adapters-gcp.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
aes-gcm = { workspace = true, features = ["aes", "zeroize"] }
zeroize.workspace = true
async-trait.workspace = true
# T-1112c: the reject -> unsubscribe proof drives the real `unsub` e2e router
# and the `unsub-testbed`, in process, on free loopback ports.
unsub = { workspace = true, features = ["testkit"] }
unsub-testbed.workspace = true

[lints]
workspace = true
