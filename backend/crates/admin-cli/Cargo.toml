[package]
name = "admin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The bootstrap tool James runs: `mt-admin` (T-507). It never depends on `api`
# (CONVENTIONS: only `api` mounts routes; the tool sets admin outside the API).
[[bin]]
name = "mt-admin"
path = "src/main.rs"

[dependencies]
domain.workspace = true
ports.workspace = true
obs.workspace = true
svc-common.workspace = true
adapters-gcp.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
time.workspace = true
url.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
testkit.workspace = true
tokio.workspace = true
sha2 = "0.10"

[lints]
workspace = true