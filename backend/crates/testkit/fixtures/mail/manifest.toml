# Synthetic mail corpus (S10 section 5). One [[case]] per required S10 case.
# Rules: reserved domains only (example.com/net/org, *.test, *.invalid); no real email.
# No canaries live here — the builder appends CANARY-<id>-<field> itself.
# `expected.class` uses the S3 names: list, bulk_no_header, notice, personal, suspect.

[[case]]
id = "one-click-covered"
source = "E1: 33 of 40 senders"
from_display = "Acme News"
from_address = "updates@example.com"
subject = "Your weekly digest"
list_id = "weekly.example.com"
list_unsubscribe = "<https://u.example.com/weekly>"
one_click_post = true
feedback_id = "news:weekly"
dkim = "pass_covers_both"
body_text = "Here is this week's roundup."
body_html = "<p>Here is this week's roundup.</p>"
date = "2026-10-02T09:00:00+00:00"
labels = ["INBOX", "UNREAD"]
expected = { class = "list", bulk_score_min = 60, bulk_score_max = 100, method = "one_click", reason = "one-click list", from_authenticated = true }

[[case]]
id = "one-click-plus-mailto"
source = "E1: 19 of 33"
from_display = "Acme News"
from_address = "updates@example.com"
subject = "Your weekly digest (with mailto)"
list_id = "weekly.example.com"
list_unsubscribe = "<https://u.example.com/weekly>, <mailto:unsub@example.com?subject=stop>"
one_click_post = true
dkim = "pass_covers_both"
body_text = "Another week, another digest."
date = "2026-10-02T09:01:00+00:00"
labels = ["INBOX"]
expected = { class = "list", bulk_score_min = 60, bulk_score_max = 100, method = "one_click", reason = "one-click preferred", from_authenticated = true }

