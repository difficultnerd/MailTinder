[package]
name = "unsub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unsub"
path = "src/main.rs"

[features]
# e2e configuration (S10 3.3). Never enabled in a release build.
testkit = ["dep:testkit", "dep:reqwest"]

[dependencies]
domain.workspace = true
ports.workspace = true
obs.workspace = true
svc-common.workspace = true
adapters-gcp.workspace = true
adapters-gmail.workspace = true
egress.workspace = true
axum = "0.7"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
url.workspace = true
async-trait.workspace = true
tracing = "0.1"
# e2e only (feature `testkit`).
testkit = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
testkit.workspace = true
egress = { workspace = true, features = ["test-policy"] }
unsub-testbed.workspace = true
tower = { version = "0.5", features = ["util"] }
proptest.workspace = true
tokio.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
reqwest.workspace = true

[lints]
workspace = true