[package]
name = "adapters-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets integration tests override the vendor base URL to a local `fake-jev`.
# A release build never enables this, so `JevConfig::production` (the pinned
# `PROD_BASE_URL`) is the only reachable configuration (CR-01 1.1).
testkit = []

[dependencies]
domain.workspace = true
ports.workspace = true
obs.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
url.workspace = true

[dev-dependencies]
testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true

[[test]]
name = "jev"
required-features = ["testkit"]

[lints]
workspace = true
