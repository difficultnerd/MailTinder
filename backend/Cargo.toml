[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates. Version must be set explicitly so cargo-deny can resolve
# `.workspace = true` usages (path-only entries are treated as wildcards).
domain = { path = "crates/domain", version = "0.1.0" }
ports = { path = "crates/ports", version = "0.1.0" }
obs = { path = "crates/obs", version = "0.1.0" }
egress = { path = "crates/egress", version = "0.1.0" }
testkit = { path = "crates/testkit", version = "0.1.0" }
adapters-gmail = { path = "crates/adapters-gmail", version = "0.1.0" }
adapters-gcp = { path = "crates/adapters-gcp", version = "0.1.0" }
adapters-models = { path = "crates/adapters-models", version = "0.1.0" }
# External crates (CONVENTIONS "Rust conventions"); versions are the current major lines
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
getrandom = "0.2"
aes-gcm = "0.10"
sha2 = "0.10"
proptest = "1"
toml = "0.8"
mail-parser = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
