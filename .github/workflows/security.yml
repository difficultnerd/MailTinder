name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.0"

jobs:
  # All five jobs below run on every event. main's branch protection lists
  # gitleaks, semgrep, cargo-audit, cargo-deny and dart-licenses as required
  # status checks with strict=true and enforce_admins=true, so gating any of
  # them off pull_request would leave every pull request permanently
  # unmergeable ("Expected - Waiting for status to be reported").
  #
  # GitHub bills each job rounded up to a whole runner minute, so this
  # workflow costs a minimum of five runner minutes on every trigger no matter
  # how fast the individual jobs are. Cutting that means merging jobs into
  # fewer ones, which changes the check names and therefore has to be done
  # together with an update to the required status checks in branch protection.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Scan
        run: |
          semgrep scan --error --metrics=off \
            --config p/default --config p/security-audit --config p/rust \
            --exclude optional/ .

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file backend/Cargo.lock --deny warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path backend/Cargo.toml check

  dart-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: python3 tools/dart_license_check.py