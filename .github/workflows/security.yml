name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.0"

jobs:
  # All five jobs below run on every event. main's branch protection lists
  # gitleaks, semgrep, cargo-audit, cargo-deny and dart-licenses as required
  # status checks with strict=true and enforce_admins=true, so gating any of
  # them off pull_request would leave every pull request permanently
  # unmergeable ("Expected - Waiting for status to be reported").
  #
  # They stay split into five jobs rather than merged into one because branch
  # protection keys on the check NAME: collapsing them would change the names
  # and silently drop the gates out of the required set unless branch
  # protection were updated in the same change.
  #
  # Cost: this repository is public, so standard-runner minutes are not billed.
  # The check-integrity job at the bottom of this file is what stops any of
  # these five from being skipped and still reading as a pass.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Scan
        run: |
          semgrep scan --error --metrics=off \
            --config p/default --config p/security-audit --config p/rust \
            --exclude optional/ .

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file backend/Cargo.lock --deny warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path backend/Cargo.toml check

  dart-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: python3 tools/dart_license_check.py

  # Integrity guard, as in ci.yml: a skipped required check reads as a pass in
  # branch protection, so this job is required and fails unless all five gates
  # actually ran and succeeded. Unique name: see ci.yml.
  security-integrity:
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, cargo-audit, cargo-deny, dart-licenses]
    if: always()
    env:
      R_GITLEAKS: ${{ needs.gitleaks.result }}
      R_SEMGREP: ${{ needs.semgrep.result }}
      R_AUDIT: ${{ needs.cargo-audit.result }}
      R_DENY: ${{ needs.cargo-deny.result }}
      R_LICENSES: ${{ needs.dart-licenses.result }}
    steps:
      - name: Assert every expected gate ran and passed
        run: |
          fail=0
          report() {
            if [ "$2" = "success" ]; then
              echo "OK   $1"
            else
              echo "FAIL $1 -> $2 (a skipped or cancelled gate is not a pass)"
              fail=1
            fi
          }
          report gitleaks      "$R_GITLEAKS"
          report semgrep       "$R_SEMGREP"
          report cargo-audit   "$R_AUDIT"
          report cargo-deny    "$R_DENY"
          report dart-licenses "$R_LICENSES"
          exit $fail