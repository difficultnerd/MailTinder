name: heavy

# The two slowest gates - the coverage floors and the CSP smoke test - live
# here rather than in `ci.yml`, in their own concurrency group.
#
# Why they are separate. They are the two gates that push a pull-request run
# past the interval at which the build drivers push to their branches. With
# `cancel-in-progress: true`, a run that is still going when the next push
# arrives is cancelled, and a cancelled required check never settles - which
# leaves the pull request permanently unmergeable. Keeping them out of `ci.yml`
# means they run at FULL DEPTH on every pull request without ever sitting on the
# merge critical path or cancelling the fast, required gates.
#
# They are deliberately NOT required status checks: a merge waits on the fast
# gates, and the deep scans are reported alongside. The nightly run means depth
# never depends on how often anyone pushes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * *" # nightly: depth must not depend on push frequency

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      - run: ../scripts/firestore-emulator.sh
        working-directory: backend
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
        working-directory: backend
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - run: flutter pub get && flutter test --coverage
        working-directory: app
      - run: python3 -m unittest discover -s tools -p 'test_check_coverage_floors.py'
      - run: python3 tools/check_coverage_floors.py --rust backend/lcov.info --flutter app/coverage/lcov.info

  csp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: scripts/csp_check.sh

  # Same integrity guard as the other workflows: a gate that silently does not
  # run must not read as a pass. Unique name across the repository - see ci.yml.
  heavy-integrity:
    runs-on: ubuntu-latest
    needs: [coverage, csp-smoke]
    if: always()
    env:
      R_COVERAGE: ${{ needs.coverage.result }}
      R_CSP: ${{ needs.csp-smoke.result }}
    steps:
      - name: Assert every expected deep scan ran and passed
        run: |
          fail=0
          report() {
            if [ "$2" = "success" ]; then
              echo "OK   $1"
            else
              echo "FAIL $1 -> $2 (a skipped or cancelled gate is not a pass)"
              fail=1
            fi
          }
          report coverage  "$R_COVERAGE"
          report csp-smoke "$R_CSP"
          exit $fail