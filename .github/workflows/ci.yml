name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deep scans (coverage floors, CSP smoke) deliberately live in `heavy.yml`,
# not here. They are the two slowest gates; keeping them out of this workflow
# keeps every pull-request run short enough to finish before the build drivers
# push again, so `cancel-in-progress` never kills the required checks
# mid-flight and leaves a pull request unmergeable. Nothing is skipped - the deep
# scans still run on every pull request, in their own concurrency group.

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      - run: ../scripts/firestore-emulator.sh
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pin the version the goldens were captured with (ADR 0001). Pinning
          # only `stable` lets a channel bump change rasterisation and fail
          # every golden; see docs/golden-tests.md. T-1111a.
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  language-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tools/check_language_policy.sh

  ac-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_ac_coverage.py

  # Terraform (T-1102a). `fmt`, `validate` and the module's plan-time tests.
  # The tests use mock_provider, so they need no credentials and no network.
  # The final step is the set of absence checks Terraform cannot express over a
  # plan. A role allowlist over every .tf file replaces hand-picked checks: it
  # fails on any role not authorised by the task (primitive roles,
  # roles/iam.serviceAccountUser, roles/logging.* for an app identity, ...),
  # wherever it is granted. Resource-type guards cover service account keys,
  # secret versions in state, Firestore backups and infrastructure scanners.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - name: Validate and test the foundation module
        working-directory: infra/terraform/modules/foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate and test the runtime module
        working-directory: infra/terraform/modules/runtime
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate the production root
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the staging root
        working-directory: infra/terraform/envs/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Staging and production use the same modules
        run: ../../scripts/tf_env_parity.sh
      - name: Absence checks
        run: |
          fail=0
          mapfile -t tf_files < <(find modules envs -name '*.tf' | sort)
          guard() { # pattern message [globs...]
            pattern="$1"; message="$2"; shift 2
            if grep -rnE "$pattern" --include="$1" modules envs 2>/dev/null; then
              echo "FAIL $message"
              fail=1
            else
              echo "OK   $message"
            fi
          }
          guard '^resource "google_service_account_key"' 'no service account keys (ASVS V13.2.1)' '*.tf'
          guard '^resource "google_secret_manager_secret_version"' 'no secret versions in state (ASVS V13.3.1)' '*.tf'
          guard '^resource "google_firestore_backup_schedule"' 'no Firestore backups (S6 5)' '*.tf'
          guard '^resource "google_project_iam_policy"' 'no authoritative project IAM policy (hidden role grants)' '*.tf'
          guard 'tfsec|checkov|terrascan|trivy' 'no infrastructure scanner (CLAUDE.md)' '*.tf'

          # Role allowlist (ASVS V13.2.1, V13.2.3, V16.4.2). `terraform test`
          # only inspects the resources the module declares, so a role granted by
          # a new IAM resource anywhere else would slip past it. This scans every
          # .tf file under modules/ and envs/ for the role values granted by
          # `role = "roles/..."` (every google_*_iam_member, google_*_iam_binding
          # and google_*_iam_policy resource) and by the `roles = ["roles/..."]`
          # list form, and fails unless every role is one this task authorises.
          # It catches primitive roles (owner/editor/viewer), the impersonation
          # roles roles/iam.serviceAccountUser and serviceAccountTokenCreator,
          # any roles/logging.* role at all (the same-project log-bucket sinks
          # need no writer grant - review D1), and any other role a later change
          # adds.
          allowed_roles=$(printf '%s\n' \
            roles/cloudkms.cryptoKeyEncrypterDecrypter \
            roles/aiplatform.user \
            roles/datastore.user \
            roles/secretmanager.secretAccessor \
            roles/run.invoker \
            roles/run.developer \
            roles/cloudtasks.enqueuer \
            roles/cloudtasks.taskDeleter \
            roles/artifactregistry.writer \
            roles/firebasehosting.admin \
            roles/iam.workloadIdentityUser \
            roles/iam.serviceAccountUser | sort -u)

          # A role granted as an expression (`role = var.x`, `role = local.x`,
          # `role = each.value`, ...) is not a literal the allowlist can read, so
          # it could grant roles/owner with CI green. Fail closed: every
          # `role`/`roles` assignment must be a plain quoted literal.
          if bad=$(grep -rnE '^[[:space:]]*roles?[[:space:]]*=[[:space:]]*[^"[:space:]\[]' \
              --include='*.tf' modules envs); then
            echo "FAIL every role value must be a quoted literal (an expression is not allowlistable):"
            printf '%s\n' "$bad"
            fail=1
          else
            echo "OK   every scalar role value is a quoted literal"
          fi

          # scalar_role_guard(): a scalar `role = "..."` must be exactly one
          # quoted roles/... literal - nothing after the closing quote but
          # whitespace and an optional comment. The guard above rejects an
          # *unquoted* expression, and the allowlist extractor below reads only
          # a literal `"roles/..."`, but a quoted value can still carry an
          # interpolation (`role = "roles/${"owner"}"`) or a conditional
          # expression (`role = "roles/datastore.user" == "" ? var.r : var.r`)
          # that starts with a literal and resolves to any role at apply time,
          # including a primitive one. A quoted prefix is not a literal, so fail
          # closed on all of them (review F5). It is a function so the self-tests
          # at the end of this step run the same logic against a fixture.
          scalar_role_guard() {
            [ "$#" -gt 0 ] || return 1
            awk '
              /^[[:space:]]*role[[:space:]]*=[[:space:]]*"/ {
                rest = $0
                sub(/^[[:space:]]*role[[:space:]]*=[[:space:]]*"/, "", rest)
                if (match(rest, /^roles\/[A-Za-z0-9._]+/)) rest = substr(rest, RLENGTH + 1)
                else rest = "!x"
                if (rest !~ /^"[[:space:]]*(#.*|\/\/.*)?$/) { print FILENAME": "$0; bad = 1 }
              }
              END { exit bad ? 1 : 0 }
            ' "$@"
          }

          if bad=$(scalar_role_guard "${tf_files[@]}"); then
            echo "OK   every scalar role value is an exact roles/... literal"
          else
            echo "FAIL a scalar role value is not an exact roles/... literal (interpolation, conditional or unsupported expression):"
            printf '%s\n' "$bad"
            fail=1
          fi

          # list_roles_guard(): the `roles = [...]` list form (an IAM binding
          # grants several roles at once) is invisible to a line-oriented grep,
          # so it is walked here: each literal element is emitted for the
          # allowlist, and any element that is not a `roles/...` literal fails
          # the guard. A function so the self-tests can reuse it.
          list_roles_guard() {
            [ "$#" -gt 0 ] || return 1
            awk '
              BEGIN { inlist = 0; bad = 0 }
              {
                line = $0
                sub(/[[:space:]]*#.*/, "", line)
                if (!inlist) {
                  if (match(line, /roles?[[:space:]]*=[[:space:]]*\[/) == 0) next
                  line = substr(line, RSTART + RLENGTH)
                  inlist = 1
                }
                rest = line
                while (length(rest) > 0) {
                  if (match(rest, /^[[:space:],]+/)) { rest = substr(rest, RLENGTH + 1); continue }
                  if (match(rest, /^"[^"]*"/)) {
                    if (substr(rest, 2, RLENGTH - 2) ~ /^roles\//) print substr(rest, 2, RLENGTH - 2)
                    else bad = 1
                    rest = substr(rest, RLENGTH + 1); continue
                  }
                  if (match(rest, /^\]/)) { inlist = 0; rest = substr(rest, 2); continue }
                  bad = 1
                  rest = substr(rest, 2)
                }
              }
              END { exit bad ? 1 : 0 }
            ' "$@"
          }

          if list_roles=$(list_roles_guard "${tf_files[@]}"); then
            echo "OK   every roles = [...] list holds literal roles"
          else
            echo "FAIL a roles = [...] list holds a non-literal role value"
            fail=1
          fi

          used_roles=$(printf '%s\n%s\n' \
            "$(grep -rhoE 'role[[:space:]]*=[[:space:]]*"roles/[A-Za-z0-9._]+"' \
               --include='*.tf' modules envs | grep -oE 'roles/[A-Za-z0-9._]+')" \
            "$list_roles" | grep -E '^roles/' | sort -u)
          unapproved=$(comm -23 <(printf '%s\n' "$used_roles") <(printf '%s\n' "$allowed_roles"))
          if [ -n "$unapproved" ]; then
            echo "FAIL unapproved IAM role(s) granted:"
            printf '%s\n' "$unapproved"
            fail=1
          else
            echo "OK   every granted IAM role is on the allowlist"
          fi

          # Belt and braces for V13.2.1. roles/iam.serviceAccountTokenCreator is
          # never allowed: it lets an identity mint a token for any service
          # account. roles/iam.serviceAccountUser (actAs) is allowed, but only
          # on an individual service account - it must never be granted on the
          # project, where it would be actAs on every account in the project.
          if grep -rnE 'roles/iam\.serviceAccountTokenCreator' --include='*.tf' modules envs; then
            echo "FAIL roles/iam.serviceAccountTokenCreator granted (ASVS V13.2.1)"
            fail=1
          else
            echo "OK   no roles/iam.serviceAccountTokenCreator"
          fi
          # `actAs` (roles/iam.serviceAccountUser) is allowed, but only on an
          # individual service account - never on the project, where it would be
          # actAs on every account. Reset the tracked resource type at every
          # top-level block, then record it on each resource header, so a grant
          # is only flagged when it is inside a google_project_iam_* resource
          # (a `locals`/`variable` block or an unparsed file no longer counts).
          if awk '
            /^[a-z_]+[[:space:]]/ && $0 !~ /^[[:space:]]*resource[[:space:]]+"/ { type = "" }
            /^[[:space:]]*resource[[:space:]]+"/ {
              type = $0
              sub(/^[[:space:]]*resource[[:space:]]+"/, "", type)
              sub(/".*/, "", type)
            }
            /role[[:space:]]*=[[:space:]]*"roles\/iam\.serviceAccountUser"/ && type ~ /^google_project_iam/ { bad = 1 }
            END { exit bad ? 1 : 0 }
          ' $(find modules envs -name '*.tf'); then
            echo "OK   roles/iam.serviceAccountUser only on individual service accounts"
          else
            echo "FAIL roles/iam.serviceAccountUser granted on the project (ASVS V13.2.1)"
            fail=1
          fi

          # Scope guard (ASVS V13.2.2, F6). A role-name allowlist is not a
          # principal/resource/scope allowlist: an allowlisted role widened from
          # a resource to the whole project would pass every check above. The
          # only roles this work grants at project scope are the two runtime
          # data roles and the deployer's Hosting admin; any other `roles/...`
          # on a `google_project_iam_*` resource (a project-scoped KMS or secret
          # role, or the old sink writer, say) fails here.
          project_allowed=$(printf '%s\n' \
            roles/datastore.user \
            roles/aiplatform.user \
            roles/firebasehosting.admin | sort -u)
          project_used=$(awk '
            /^[a-z_]+[[:space:]]/ && $0 !~ /^[[:space:]]*resource[[:space:]]+"/ { type = "" }
            /^[[:space:]]*resource[[:space:]]+"/ {
              type = $0
              sub(/^[[:space:]]*resource[[:space:]]+"/, "", type)
              sub(/".*/, "", type)
            }
            type ~ /^google_project_iam/ {
              n = split($0, a, /"/)
              for (i = 2; i <= n; i += 2) if (a[i] ~ /^roles\//) print a[i]
            }
          ' $(find modules envs -name '*.tf') | sort -u)
          overreach=$(comm -23 <(printf '%s\n' "$project_used") <(printf '%s\n' "$project_allowed"))
          if [ -n "$overreach" ]; then
            echo "FAIL role(s) granted at project scope beyond the allowlist (scope widening, V13.2.2):"
            printf '%s\n' "$overreach"
            fail=1
          else
            echo "OK   project-level IAM grants stay within the allowed roles"
          fi

          # cloud_run_iam_guard(): roles/run.invoker is allowlisted globally, so
          # an added IAM binding on `unsub` or `worker` would pass both the
          # allowlist and the allUsers guard (which watches allUsers only). The
          # only legitimate way to grant it is one of the four pinned bindings,
          # so every binding that grants roles/run.invoker (or the deployer's
          # roles/run.developer) is pinned here by *type*, module file, target
          # service, role and principal - in ANY Cloud Run IAM resource family.
          # A v1 `google_cloud_run_service_iam_member` (or `_binding`/`_policy`)
          # on a v2-created service, a duplicate label elsewhere, a widened role
          # or a switched target all fail (V12.3.3, V13.2.2, F6). A function so
          # the self-tests reuse it.
          cloud_run_iam_guard() {
            [ "$#" -gt 0 ] || return 1
            awk '
              function reset() {
                type = ""; label = ""; fname = ""; nameexpr = ""; roleval = ""; member = ""
                invoker = 0; developer = 0
              }
              function check(   etype, ef, er, en, m_ok, m_msg) {
                if (!invoker && !developer) return
                if (label == "api_public") {
                  etype = "google_cloud_run_v2_service_iam_member"
                  ef = "modules/runtime/cloud_run\\.tf$"; er = "roles/run.invoker"; en = "google_cloud_run_v2_service.api.name"
                  m_ok = (member ~ /"allUsers"/); m_msg = "principal is not allUsers"
                } else if (label == "unsub_tasks_invoker") {
                  etype = "google_cloud_run_v2_service_iam_member"
                  ef = "modules/runtime/cloud_run\\.tf$"; er = "roles/run.invoker"; en = "google_cloud_run_v2_service.unsub.name"
                  m_ok = (index(member, "tasks_invoker") && index(member, "serviceAccount:")); m_msg = "principal is not the tasks-invoker identity"
                } else if (label == "worker_scheduler_invoker") {
                  etype = "google_cloud_run_v2_service_iam_member"
                  ef = "modules/runtime/cloud_run\\.tf$"; er = "roles/run.invoker"; en = "google_cloud_run_v2_service.worker.name"
                  m_ok = (index(member, "scheduler_invoker") && index(member, "serviceAccount:")); m_msg = "principal is not the scheduler-invoker identity"
                } else if (label == "deployer_run_developer") {
                  etype = "google_cloud_run_v2_service_iam_member"
                  ef = "modules/runtime/deploy_identity\\.tf$"; er = "roles/run.developer"; en = "each.value"
                  m_ok = (index(member, "serviceAccount:") && index(member, "deployer")); m_msg = "principal is not the deployer identity"
                } else {
                  print fname ": run.invoker/run.developer granted by an unpinned binding " label " (type " type ")"
                  bad = 1
                  return
                }
                if (type != etype) { print fname " " label ": resource type " type " is not " etype " (v1, or a _binding/_policy family, is not allowed here)"; bad = 1 }
                if (fname !~ ef) { print fname " " label ": binding is outside its pinned module file"; bad = 1 }
                if (roleval != er) { print fname " " label ": role " roleval " is not " er; bad = 1 }
                if (nameexpr != en) { print fname " " label ": target " nameexpr " is not " en; bad = 1 }
                if (!m_ok) { print fname " " label ": " m_msg; bad = 1 }
              }
              /^[[:space:]]*resource[[:space:]]+\"/ {
                check()
                reset()
                split($0, parts, "\"")
                type = parts[2]
                label = parts[4]
                fname = FILENAME
                next
              }
              /^}/ { check(); reset(); next }
              {
                if (type != "") {
                  t = $0
                  sub(/[[:space:]]*#.*/, "", t)
                  if (t ~ /^[[:space:]]*role[[:space:]]*=/) {
                    split(t, rp, "\"")
                    roleval = rp[2]
                    if (roleval == "roles/run.invoker") invoker = 1
                    if (roleval == "roles/run.developer") developer = 1
                  }
                  if (t ~ /^[[:space:]]*roles[[:space:]]*=/) {
                    n = split(t, rp, "\"")
                    for (i = 2; i <= n; i += 2) {
                      if (rp[i] == "roles/run.invoker") invoker = 1
                      if (rp[i] == "roles/run.developer") developer = 1
                    }
                    if (roleval == "" && n >= 2) roleval = rp[2]
                  }
                  if (t ~ /^[[:space:]]*name[[:space:]]*=/) {
                    nameexpr = t
                    sub(/^[^=]*=[[:space:]]*/, "", nameexpr)
                    sub(/[[:space:]]*,?[[:space:]]*$/, "", nameexpr)
                  }
                  if (t ~ /^[[:space:]]*member[[:space:]]*=/) member = t
                }
              }
              END { check(); exit bad ? 1 : 0 }
            ' "$@"
          }

          if bad=$(cloud_run_iam_guard "${tf_files[@]}"); then
            echo "OK   every Cloud Run invoker/developer binding is the pinned (type, file, service, role, principal)"
          else
            echo "FAIL an unexpected or mis-targeted Cloud Run IAM binding (V12.3.3, V13.2.2, F6):"
            printf '%s\n' "$bad"
            fail=1
          fi

          # Only `api_public` may name allUsers / allAuthenticatedUsers. The
          # role allowlist permits roles/run.invoker globally, so it cannot see
          # a second public binding on another service; this can (V13.2.1).
          if awk '
            /^[[:space:]]*resource[[:space:]]+"/ { res = $0 }
            /^[a-z_]+[[:space:]]/ && $0 !~ /^[[:space:]]*resource[[:space:]]+"/ { res = "" }
            /allUsers|allAuthenticatedUsers/ && res !~ /"api_public"/ { bad = 1 }
            END { exit bad ? 1 : 0 }
          ' $(find modules envs -name '*.tf'); then
            echo "OK   allUsers/allAuthenticatedUsers only on api_public"
          else
            echo "FAIL allUsers/allAuthenticatedUsers outside api_public (ASVS V13.2.1)"
            fail=1
          fi

          # `ignore_changes` on the container image cannot be read from a
          # Terraform expression, so terraform test cannot prove it. Without it
          # every apply would roll production back to the placeholder image
          # (T-1102b edge case), so guard it per service here. The image path
          # must sit inside the service's own `ignore_changes` list: counting
          # occurrences anywhere in the file would let a stray comment (or a
          # second line) inflate the count and mask a service whose ignore list
          # is missing. The comment stripper is string- and heredoc-aware: `#`,
          # `//` and `/* ... */` are only comments *outside* a quoted string or
          # heredoc, so a `"/*"` in a string cannot open a comment that swallows
          # a whole service (review F10). The service labels are emitted too, so
          # the caller can pin the expected service set, not just a count.
          image_guard() { # prints "<services that ignore the image> <services> <labels>"
            [ "$#" -gt 0 ] || return 1
            awk '
              BEGIN { blk = 0; in_str = 0; here = "" }
              {
                # A heredoc body is string material, not code: drop it so nothing
                # inside it is read as HCL.
                if (here != "") {
                  if ($0 ~ ("^[[:space:]]*" here "[[:space:]]*$")) here = ""
                  print ""
                  next
                }
                line = $0; out = ""; i = 1; n = length(line)
                while (i <= n) {
                  c1 = substr(line, i, 1); c2 = substr(line, i, 2)
                  if (in_str) {
                    if (c1 == "\\") { out = out c2; i += 2; continue }
                    if (c1 == "\"") in_str = 0
                    out = out c1; i++; continue
                  }
                  if (blk) {
                    p = index(substr(line, i), "*/")
                    if (p == 0) { i = n + 1; continue }
                    i = i + p + 1; blk = 0; continue
                  }
                  if (c2 == "/*") { blk = 1; i += 2; continue }
                  if (c2 == "//") break
                  if (c1 == "#") break
                  if (c1 == "\"") { in_str = 1; out = out c1; i++; continue }
                  if (c2 == "<<") {
                    r = substr(line, i + 2)
                    sub(/^-/, "", r)
                    if (match(r, /^[A-Za-z_][A-Za-z0-9_]*/)) {
                      here = substr(r, RSTART, RLENGTH)
                      out = out c2 r
                      i = n + 1
                      continue
                    }
                  }
                  out = out c1; i++
                }
                print out
              }
            ' "$1" | awk '
              /^[[:space:]]*resource[[:space:]]+"google_cloud_run_v2_service"[[:space:]]+"/ {
                if (seen) { total++; if (has) good++ }
                split($0, rp, "\"")
                if (rp[4] != "") labels[rp[4]] = 1
                seen = 1; has = 0; in_ign = 0; next
              }
              /^[[:space:]]*resource[[:space:]]+"/ {
                if (seen) { total++; if (has) good++ }
                seen = 0; in_ign = 0; next
              }
              {
                line = $0
                if (seen && line ~ /ignore_changes[[:space:]]*=[[:space:]]*\[/) in_ign = 1
                if (seen && in_ign && line ~ /template\[0\]\.containers\[0\]\.image/) has = 1
                if (seen && in_ign && line ~ /\]/) in_ign = 0
              }
              END {
                if (seen) { total++; if (has) good++ }
                lab = ""
                for (l in labels) lab = lab (lab == "" ? "" : ",") l
                print good + 0, total + 0, lab
              }
            '
          }

          img=$(image_guard modules/runtime/cloud_run.tf)
          read -r good total labels <<<"$img"
          # Verify the expected service set as well as the count: a comment that
          # swallowed a service would drop `total`, and the label pin makes the
          # missing service unmistakable (review F10).
          labels_sorted=$(printf '%s\n' ${labels//,/ } | sort | paste -sd, -)
          if [ "${total:-0}" -eq 3 ] && [ "${good:-0}" -eq "${total:-0}" ] && [ "${labels_sorted:-}" = "api,unsub,worker" ]; then
            echo "OK   every Cloud Run service (api, unsub, worker) ignores the container image inside ignore_changes"
          else
            echo "FAIL image ignore_changes: ${good:-0} of ${total:-0} Cloud Run services (${labels:-none}) (T-1102b)"
            fail=1
          fi

          # ------------------------------------------------------------------
          # Guard self-tests (review F5, F6, F10). Each guard above must reject
          # its negative fixture, or a future edit that neuters it would keep CI
          # green. The fixtures live under tests/guards/negative/ - outside
          # modules/ and envs/, so the real-tree scans never see them - and are
          # fed to the very functions that guard the repository.
          # ------------------------------------------------------------------
          neg=tests/guards/negative

          # A missing fixture must fail, not read as "the guard rejected
          # nothing": awk on a missing file exits non-zero and the exits below
          # would otherwise look like a pass.
          for fixture in \
            role_conditional/main.tf \
            dup_api_public_root/envs/prod/main.tf \
            dup_api_public_wrong_service/modules/runtime/cloud_run.tf \
            run_invoker_v1_unsub/main.tf \
            run_invoker_v1_pinned/modules/runtime/cloud_run.tf \
            image_ignore_slash_comment/main.tf \
            image_ignore_block_comment/main.tf \
            image_string_comment/main.tf; do
            if [ ! -f "$neg/$fixture" ]; then
              echo "FAIL guard self-test: missing negative fixture $neg/$fixture"
              fail=1
            fi
          done

          # Require the guard to both fail and say what it found, so neither a
          # neutered guard nor a crash counts as "rejected".
          if out=$(scalar_role_guard "$neg/role_conditional/main.tf") || [ -z "$out" ]; then
            echo "FAIL guard self-test: the scalar-role guard did not reject the conditional role expression"
            fail=1
          else
            echo "OK   guard self-test: the scalar-role guard rejects a conditional role expression"
          fi

          # Every way to grant run.invoker that must be rejected: a duplicate
          # public invoker in a root and in the module, a v1 resource type on a
          # v2-created service under a fresh label, and the same v1 type with the
          # pinned label (so the type pin alone rejects it). All four are fed
          # (review F6).
          for fixture in \
            dup_api_public_root/envs/prod/main.tf \
            dup_api_public_wrong_service/modules/runtime/cloud_run.tf \
            run_invoker_v1_unsub/main.tf \
            run_invoker_v1_pinned/modules/runtime/cloud_run.tf; do
            if out=$(cloud_run_iam_guard "$neg/$fixture") || [ -z "$out" ]; then
              echo "FAIL guard self-test: the Cloud Run IAM guard did not reject $fixture"
              fail=1
            else
              echo "OK   guard self-test: the Cloud Run IAM guard rejects $fixture"
            fi
          done

          # A read image guard reports "<ignored> <services> <labels>". A fixture
          # with no service at all (total 0) means the fixture could not be read,
          # which must fail too; otherwise a service that ignores the image
          # (good == total) is the regression we are testing for. The
          # string-comment fixture in particular must still count all three
          # services (a non-string-aware stripper swallows one and passes).
          for fixture in image_ignore_slash_comment image_ignore_block_comment image_string_comment; do
            fx=$(image_guard "$neg/$fixture/main.tf")
            read -r good total labels <<<"$fx"
            if [ "${total:-0}" -eq 0 ] || [ "${good:-0}" -eq "${total:-0}" ]; then
              echo "FAIL guard self-test: the image guard did not reject $fixture (a commented traversal treated as ignored)"
              fail=1
            else
              echo "OK   guard self-test: the image guard rejects $fixture"
            fi
          done

          exit $fail

  # End-to-end harness (T-1101a): builds and runs the whole local stack and
  # drives the browser journeys (S10 3.3). Separate from `rust` because it needs
  # Flutter, Chrome, ChromeDriver and the Firestore emulator, and it is required
  # by branch protection (tools/apply_branch_protection.sh).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      # Production must compile without testkit; separately prove the real
      # test route is absent and startup refuses MT_E2E in that build.
      # The workspace `rust` job also proves feature + runtime gating.
      - run: cargo build --release --locked -p api --no-default-features
      - run: cargo test --locked -p api --no-default-features --test release_routes
      - run: cargo test --locked -p api --no-default-features --test startup
      # `unsub`'s own no-testkit refusal guard (T-1112d); the workspace `rust`
      # job's `--all-features` compiles the guard out, so it must run here.
      - run: cargo test --locked -p unsub --no-default-features --test startup_e2e
      - run: flutter pub get
        working-directory: app
      - run: scripts/e2e.sh
        working-directory: .
      # Diagnostics from a failed run: screenshots, page text/source, the
      # semantics tree, the browser console log, the ChromeDriver tail and the
      # service logs. Runs when a step fails and when the timeout cancels the
      # job, so a red run is always diagnosable.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: target/e2e-logs/
          if-no-files-found: ignore

  # Integrity guard. Branch protection treats a SKIPPED required job as a pass,
  # so a gate that quietly does not run is worse than no gate at all. This job
  # is required, and fails unless every gate above actually ran and succeeded -
  # making "the check did not execute" indistinguishable from "the check
  # failed", which is the safe direction to be wrong in.
  #
  # The job name is unique across the repository (ci-/security-/privacy-/
  # heavy-integrity). Branch protection keys on the bare check name, so four
  # jobs sharing one name would make it ambiguous which run gates a merge.
  ci-integrity:
    runs-on: ubuntu-latest
    needs: [rust, dart, language-policy, ac-coverage, terraform, e2e]
    if: always()
    env:
      R_RUST: ${{ needs.rust.result }}
      R_DART: ${{ needs.dart.result }}
      R_LANG: ${{ needs.language-policy.result }}
      R_AC: ${{ needs.ac-coverage.result }}
      R_TF: ${{ needs.terraform.result }}
      R_E2E: ${{ needs.e2e.result }}
    steps:
      - name: Assert every expected gate ran and passed
        run: |
          fail=0
          report() {
            if [ "$2" = "success" ]; then
              echo "OK   $1"
            else
              echo "FAIL $1 -> $2 (a skipped or cancelled gate is not a pass)"
              fail=1
            fi
          }
          report rust            "$R_RUST"
          report dart            "$R_DART"
          report language-policy "$R_LANG"
          report ac-coverage     "$R_AC"
          report terraform       "$R_TF"
          report e2e             "$R_E2E"
          exit $fail
