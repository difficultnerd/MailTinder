name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deep scans (coverage floors, CSP smoke) deliberately live in `heavy.yml`,
# not here. They are the two slowest gates; keeping them out of this workflow
# keeps every pull-request run short enough to finish before the build drivers
# push again, so `cancel-in-progress` never kills the required checks
# mid-flight and leaves a pull request unmergeable. Nothing is skipped - the deep
# scans still run on every pull request, in their own concurrency group.

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      - run: ../scripts/firestore-emulator.sh
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  language-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tools/check_language_policy.sh

  ac-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_ac_coverage.py

  # Terraform (T-1102a). `fmt`, `validate` and the module's plan-time tests.
  # The tests use mock_provider, so they need no credentials and no network.
  # The final step is the set of absence checks Terraform cannot express over a
  # plan: no service account keys, no secret versions in state, no Firestore
  # backups, no primitive role, and no infrastructure scanner (CLAUDE.md).
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - name: Validate and test the foundation module
        working-directory: infra/terraform/modules/foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate the production root
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Absence checks
        run: |
          fail=0
          guard() { # pattern message [globs...]
            pattern="$1"; message="$2"; shift 2
            if grep -rnE "$pattern" --include="$1" modules envs 2>/dev/null; then
              echo "FAIL $message"
              fail=1
            else
              echo "OK   $message"
            fi
          }
          guard '^resource "google_service_account_key"' 'no service account keys' '*.tf'
          guard '^resource "google_secret_manager_secret_version"' 'no secret versions in state (ASVS V13.3.1)' '*.tf'
          guard '^resource "google_firestore_backup_schedule"' 'no Firestore backups (S6 5)' '*.tf'
          guard 'role[[:space:]]*=[[:space:]]*"roles/(owner|editor|viewer)"' 'no primitive roles (ASVS V13.2.3)' '*.tf'
          guard 'tfsec|checkov|terrascan|trivy' 'no infrastructure scanner (CLAUDE.md)' '*.tf'
          exit $fail

  # Integrity guard. Branch protection treats a SKIPPED required job as a pass,
  # so a gate that quietly does not run is worse than no gate at all. This job
  # is required, and fails unless every gate above actually ran and succeeded -
  # making "the check did not execute" indistinguishable from "the check
  # failed", which is the safe direction to be wrong in.
  #
  # The job name is unique across the repository (ci-/security-/privacy-/
  # heavy-integrity). Branch protection keys on the bare check name, so four
  # jobs sharing one name would make it ambiguous which run gates a merge.
  ci-integrity:
    runs-on: ubuntu-latest
    needs: [rust, dart, language-policy, ac-coverage, terraform]
    if: always()
    env:
      R_RUST: ${{ needs.rust.result }}
      R_DART: ${{ needs.dart.result }}
      R_LANG: ${{ needs.language-policy.result }}
      R_AC: ${{ needs.ac-coverage.result }}
      R_TF: ${{ needs.terraform.result }}
    steps:
      - name: Assert every expected gate ran and passed
        run: |
          fail=0
          report() {
            if [ "$2" = "success" ]; then
              echo "OK   $1"
            else
              echo "FAIL $1 -> $2 (a skipped or cancelled gate is not a pass)"
              fail=1
            fi
          }
          report rust            "$R_RUST"
          report dart            "$R_DART"
          report language-policy "$R_LANG"
          report ac-coverage     "$R_AC"
          report terraform       "$R_TF"
          exit $fail
