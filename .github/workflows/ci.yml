name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deep scans (coverage floors, CSP smoke) deliberately live in `heavy.yml`,
# not here. They are the two slowest gates; keeping them out of this workflow
# keeps every pull-request run short enough to finish before the build drivers
# push again, so `cancel-in-progress` never kills the required checks
# mid-flight and leaves a pull request unmergeable. Nothing is skipped - the deep
# scans still run on every pull request, in their own concurrency group.

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      - run: ../scripts/firestore-emulator.sh
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  language-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tools/check_language_policy.sh

  ac-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_ac_coverage.py

  # End-to-end harness (T-1101a): builds and runs the whole local stack and
  # drives the browser journeys (S10 3.3). Separate from `rust` because it needs
  # Flutter, Chrome, ChromeDriver and the Firestore emulator, and it is required
  # by branch protection (tools/apply_branch_protection.sh).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator,beta
      # Prove the test-only routes are absent from a build without the feature;
      # the workspace `rust` job uses --all-features, so this needs its own run.
      - run: cargo test --locked -p api --test release_routes
      - run: flutter pub get
        working-directory: app
      - run: scripts/e2e.sh
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: target/e2e-logs/
          if-no-files-found: ignore

  # Integrity guard. Branch protection treats a SKIPPED required job as a pass,
  # so a gate that quietly does not run is worse than no gate at all. This job
  # is required, and fails unless every gate above actually ran and succeeded -
  # making "the check did not execute" indistinguishable from "the check
  # failed", which is the safe direction to be wrong in.
  #
  # The job name is unique across the repository (ci-/security-/privacy-/
  # heavy-integrity). Branch protection keys on the bare check name, so four
  # jobs sharing one name would make it ambiguous which run gates a merge.
  ci-integrity:
    runs-on: ubuntu-latest
    needs: [rust, dart, language-policy, ac-coverage, e2e]
    if: always()
    env:
      R_RUST: ${{ needs.rust.result }}
      R_DART: ${{ needs.dart.result }}
      R_LANG: ${{ needs.language-policy.result }}
      R_AC: ${{ needs.ac-coverage.result }}
      R_E2E: ${{ needs.e2e.result }}
    steps:
      - name: Assert every expected gate ran and passed
        run: |
          fail=0
          report() {
            if [ "$2" = "success" ]; then
              echo "OK   $1"
            else
              echo "FAIL $1 -> $2 (a skipped or cancelled gate is not a pass)"
              fail=1
            fi
          }
          report rust            "$R_RUST"
          report dart            "$R_DART"
          report language-policy "$R_LANG"
          report ac-coverage     "$R_AC"
          report e2e             "$R_E2E"
          exit $fail
