name: privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Rule tests
        run: semgrep --test --config .semgrep/ .semgrep/tests/
      - name: Sensitive-field logging and project rules
        run: semgrep scan --error --metrics=off --config .semgrep/privacy.yml --config .semgrep/mailtinder.yml backend app
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy with logging macros disallowed
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings

  # Integrity guard, as in ci.yml: a skipped required check reads as a pass in
  # branch protection, so this job is required and fails unless the gate above
  # actually ran and succeeded.
  check-integrity:
    runs-on: ubuntu-latest
    needs: [privacy-checks]
    if: always()
    steps:
      - name: Assert the privacy gate ran and passed
        run: |
          if [ "${{ needs.privacy-checks.result }}" = "success" ]; then
            echo "OK   privacy-checks"
          else
            echo "FAIL privacy-checks -> ${{ needs.privacy-checks.result }} (a skipped or cancelled gate is not a pass)"
            exit 1
          fi
