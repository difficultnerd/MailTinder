name: privacy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Rule tests
        run: semgrep --test --config .semgrep/ .semgrep/tests/
      - name: Sensitive-field logging and project rules
        run: semgrep scan --error --metrics=off --config .semgrep/privacy.yml --config .semgrep/mailtinder.yml backend app
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy with logging macros disallowed
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings
